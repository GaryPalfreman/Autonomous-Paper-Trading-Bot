name: Autonomous market cycle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/market-cycle.yml"
  schedule:
    # Broad UTC window covers US regular hours through daylight-saving changes.
    # Each cycle refreshes research, SPY benchmark and the virtual ledger.
    # The engine checks Alpaca's market clock and never fills while closed.
    - cron: "*/15 13-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: paper-market-cycle
  cancel-in-progress: false

jobs:
  run-paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check market-data credentials
        id: credentials
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          if [ -n "$ALPACA_API_KEY" ] && [ -n "$ALPACA_API_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Alpaca developer secrets are not configured; skipping safely."
          fi
      - name: Run autonomous paper cycle
        if: steps.credentials.outputs.ready == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_DATA_FEED: iex
        run: python scripts/run_cycle.py
      - name: Persist paper portfolio results
        if: steps.credentials.outputs.ready == 'true'
        run: |
          if git diff --quiet -- data reports; then
            exit 0
          fi
          git config user.name "paper-trading-bot"
          git config user.email "paper-trading-bot@users.noreply.github.com"
          git add data reports
          git commit -m "Update autonomous paper portfolio"
          git push
