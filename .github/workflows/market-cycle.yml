
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/market-cycle.yml"
  schedule:
    # Broad UTC window covers US regular hours through daylight-saving changes.
    # The engine checks Alpaca's market clock and never fills while closed.
    - cron: "*/30 13-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: paper-market-cycle
  cancel-in-progress: false

jobs:
  run-paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
